version: "3.9"

services:
  agent-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NIM_BASE_URL=${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NIM_MODEL=${NIM_MODEL:-meta/llama-3.1-70b-instruct}
      - CHECKPOINT_BACKEND=${CHECKPOINT_BACKEND:-memory}
      - REVIEWER_SCORE_THRESHOLD=${REVIEWER_SCORE_THRESHOLD:-0.75}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-3}
      - DEFAULT_AGENT_CONFIG=${DEFAULT_AGENT_CONFIG:-configs/agents/sales_pipeline.yaml}
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - /tmp/agent_workspace:/tmp/agent_workspace

networks:
  default:
    name: multi-agent-net
