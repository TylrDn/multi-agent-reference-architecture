version: "3.9"

services:
  api:
    build: ..
    command: uvicorn api.server:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
