# Sales Pipeline Agent Config
# Generalized from the WatsonX 8-stage competition pipeline.
# Maps the OPER pattern to an enterprise B2B sales qualification workflow.

name: sales_pipeline
description: "8-stage B2B sales qualification and outreach pipeline"
model: meta/llama3-70b-instruct
temperature: 0.2
max_retries: 2
pass_threshold: 0.75

tools:
  - api_get
  - api_post
  - db_query
  - file_read
  - file_write

stages:
  - id: prospect_research
    description: "Enrich company and contact data from external sources"
    tool: api_get
  - id: icp_score
    description: "Score account against Ideal Customer Profile criteria"
    tool: db_query
  - id: pain_hypothesis
    description: "Generate pain point hypotheses based on company profile"
    tool: api_post
  - id: outreach_draft
    description: "Draft personalised outreach email or LinkedIn message"
    tool: file_write
  - id: sequence_enroll
    description: "Enroll contact into CRM outreach sequence via API"
    tool: api_post

persona:
  role: "Senior Enterprise Account Executive"
  tone: "Professional, concise, insight-led"
  constraints:
    - "Never make claims without citing a data source"
    - "Keep outreach under 150 words"
    - "Always reference a specific pain point"
