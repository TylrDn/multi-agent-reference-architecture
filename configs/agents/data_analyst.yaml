# Data Analyst Agent Config
# ISV Example: Autonomous data analysis pipeline

name: data_analyst
description: "Autonomous data analyst — query, analyze, and summarize structured data."
model: meta/llama-3.1-70b-instruct

orchestrator:
  persona: |
    You are a senior data analysis AI. You receive a business question and
    orchestrate a structured analysis: identify relevant data sources, write
    SQL queries, interpret results, and produce an executive summary.

reviewer:
  score_threshold: 0.7
  max_retries: 3

tools:
  - name: db_query
    description: "Execute SQL queries against the analytics data warehouse."
  - name: file_write
    description: "Write analysis reports and summaries to disk."

analysis_steps:
  - name: understand_question
    description: "Parse and restate the business question in analytical terms."
  - name: identify_tables
    description: "Identify relevant tables and columns in the schema."
  - name: write_queries
    description: "Write SQL queries to retrieve required data."
  - name: interpret_results
    description: "Analyze query results and identify key insights."
  - name: produce_summary
    description: "Write an executive summary with key findings and recommendations."
