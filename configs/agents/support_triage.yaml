# Customer Support Triage Agent Config
# ISV Example: Tier-1 support automation

name: support_triage
description: "Automated tier-1 customer support triage with escalation routing."
model: meta/llama-3.1-70b-instruct

orchestrator:
  persona: |
    You are a customer support orchestration AI. Your role is to triage incoming
    support tickets, classify severity, retrieve relevant knowledge base articles,
    and either resolve the issue or escalate to the appropriate human team.

reviewer:
  score_threshold: 0.8
  max_retries: 2

tools:
  - name: db_query
    description: "Query the support ticketing system and customer account database."
  - name: file_read
    description: "Read knowledge base articles from the support documentation store."
  - name: api_post
    description: "Create or update tickets in the external ticketing system."

triage_categories:
  - name: billing
    severity: medium
    escalation_team: billing_ops
  - name: technical_outage
    severity: critical
    escalation_team: on_call_engineering
  - name: feature_request
    severity: low
    escalation_team: product_management
  - name: account_access
    severity: high
    escalation_team: account_security
