# Tool capability registry
# Each tool maps a name to a Python module + function for dynamic loading

api_get:
  module: tools.api_node
  function: api_get
  description: "Perform an HTTP GET request to a URL and return the response body."

api_post:
  module: tools.api_node
  function: api_post
  description: "Perform an HTTP POST request with a JSON payload."

db_query:
  module: tools.db_node
  function: db_query
  description: "Execute a read-only SQL SELECT query and return formatted results."

file_read:
  module: tools.file_node
  function: file_read
  description: "Read a text file from the agent sandbox directory."

file_write:
  module: tools.file_node
  function: file_write
  description: "Write text content to a file in the agent sandbox directory."
