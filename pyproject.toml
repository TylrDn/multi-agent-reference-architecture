[project]
name = "multi-agent-reference-architecture"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disable_error_code = ["attr-defined", "call-arg", "arg-type", "union-attr", "type-var"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
