name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy core/ state/ tools/ api/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v --cov=core --cov=state --cov=tools --cov-report=term-missing
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
