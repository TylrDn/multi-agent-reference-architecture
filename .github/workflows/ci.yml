name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy core/ state/ tools/ api/ --ignore-missing-imports --no-strict-optional --disable-error-code=attr-defined,call-arg,arg-type,union-attr,type-var

      - name: Run tests
        run: pytest tests/ -v --cov=core --cov=tools --cov=state
